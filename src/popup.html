<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Haajar</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>Haajar (ഹാജർ)</h1>
          <p id="syncMeta">No portal sync yet</p>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="openSetupButton" title="Open Setup">⚙️</button>
          <button id="syncButton" class="primary">Sync</button>
        </div>
      </header>
      <div id="syncStatus" class="sync-status" role="status"></div>

      <nav class="tabs">
        <button class="tab is-active" data-view="dashboard">Dashboard</button>
        <button class="tab" data-view="simulator">Simulator</button>
      </nav>

      <section id="dashboard" class="view is-active">
        <section id="classContext" class="class-context"></section>
        <div class="summary">
          <div><span class="label">Active Window</span><strong id="activeWindowLabel">Semester</strong></div>
          <div><span class="label">Target</span><strong id="targetLabel">75%</strong></div>
          <div><span class="label">Records</span><strong id="recordCount">0</strong></div>
        </div>
        <div id="subjectList" class="subject-list"></div>
      </section>

      <section id="simulator" class="view">
        <form id="leaveForm" class="panel">
          <div class="grid">
            <label>Leave starts<input id="leaveStart" type="date" required></label>
            <label>Leave ends<input id="leaveEnd" type="date" required></label>
          </div>
          <button class="primary" type="submit" style="width: 100%; margin-top: 10px;">Simulate Cuts</button>
        </form>
        <div id="simulationResult" class="subject-list"></div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
